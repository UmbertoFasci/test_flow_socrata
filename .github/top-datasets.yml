name: Top Socrata datasets by size

on:
  schedule:
    - cron: "0 12 * * 1"   # Mondays 12:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Rank datasets
        env:
          SOCRATA_DOMAIN: data.austintexas.gov
          SOCRATA_APP_TOKEN: ${{ secrets.SOCRATA_APP_TOKEN }}
          TOP_N: "10"
          OUTPUT_PATH: TOP_DATASETS.md
        run: python scripts/top_datasets.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add TOP_DATASETS.md
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update top datasets ($(date -u +%Y-%m-%d))"
            git push
          fi